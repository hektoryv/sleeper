<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>Cross Sums</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <button id="restart" class="icon-button" type="button" title="Replay this board" aria-label="Replay this board">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
        <div class="title">
          <p id="difficulty" class="difficulty">&nbsp;</p>
          <h1 id="board-name">Cross Sums</h1>
        </div>
        <button id="new-game" class="icon-button" type="button" title="New board" aria-label="New board">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        </button>
        <button id="settings-open" class="icon-button" type="button" title="Appearance" aria-label="Appearance" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4m0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4m0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4"/></svg>
        </button>
      </header>

      <div id="hearts" class="hearts" role="status" aria-label="Lives remaining"></div>

      <div id="board" class="board" role="grid" aria-label="Cross sums board"></div>

      <div class="controls">
        <button id="mode-toggle" class="mode-switch" type="button" role="switch" aria-checked="false" aria-label="Tap mode: crossing out">
          <span class="mode-thumb" aria-hidden="true"></span>
          <span class="mode-icon" data-mode="remove" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M16.2 3.6 21 8.4a2 2 0 0 1 0 2.8l-8 8H19v2H8.2a2 2 0 0 1-1.4-.6l-3.4-3.4a2 2 0 0 1 0-2.8L13.4 3.6a2 2 0 0 1 2.8 0M11 17.6l-3.6-3.6-2.2 2.2L8.8 19.8z"/></svg>
          </span>
          <span class="mode-icon" data-mode="keep" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zm17.7-10.2a1 1 0 0 0 0-1.4l-2.35-2.35a1 1 0 0 0-1.4 0l-1.84 1.83 3.75 3.75z"/></svg>
          </span>
        </button>
      </div>
    </main>

    <section id="settings" class="settings" hidden aria-label="Appearance">
      <div class="settings-head">
        <h2>Appearance</h2>
        <button id="settings-reset" class="link-button" type="button">Reset</button>
        <button id="settings-close" class="icon-button" type="button" aria-label="Close appearance settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
        </button>
      </div>
      <div id="settings-controls"></div>
    </section>

    <div id="overlay" class="overlay" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <h2 id="overlay-title"></h2>
        <p id="overlay-time" class="overlay-time"></p>
        <p id="overlay-body"></p>
        <div class="sheet-buttons">
          <button id="overlay-again" class="text-button" type="button"></button>
          <button id="overlay-next" class="text-button primary" type="button"></button>
        </div>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
